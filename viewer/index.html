<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RampageRE viewer</title>
<style>
  :root { --bg: #1d1f23; --fg: #e6e6e6; --panel: rgba(20, 22, 26, 0.85); --accent: #7fb3ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  #panel { position: absolute; top: 8px; left: 8px; background: var(--panel); padding: 8px 10px; border-radius: 6px;
           max-width: calc(100% - 36px); }
  #panel select, #panel input { background: #2a2d33; color: var(--fg); border: 1px solid #444; border-radius: 4px; }
  #info { margin-top: 6px; color: #aaa; }
  a { color: var(--accent); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <label>Model <select id="file"></select></label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label id="animrow" hidden>Animation <select id="anim"></select></label>
  <div id="info">Export with <code>tools/mesh.py</code> or <code>tools/city.py</code> into build/gltf, serve the repository root.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1f23);
// the exported files are Y-up (a root node turns the game's Z-up)
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 2.5));
let current = null, mixer = null, clips = [];
const clock = new THREE.Clock();
const animSelect = document.getElementById('anim');
animSelect.onchange = () => play(animSelect.value);
function play(name) {
  if (!mixer) return;
  mixer.stopAllAction();
  const clip = clips.find(c => c.name === name);
  if (clip) mixer.clipAction(clip).play();
}

const params = new URLSearchParams(location.search);
const files = (params.get('files') ||
  'monsters/George,monsters/Lizzie,monsters/Ralph,Chicago/CG01_Block1,NewYork/NY10_Empire_State,George').split(',');
const select = document.getElementById('file');
if (params.get('file') && !files.includes(params.get('file'))) files.unshift(params.get('file'));
for (const f of files) select.add(new Option(f, f));
select.value = params.get('file') || files[0];
select.onchange = () => load(select.value);
document.getElementById('wire').onchange = e => current && current.traverse(o => {
  if (o.material) o.material.wireframe = e.target.checked;
});

function load(name) {
  new GLTFLoader().load(`../build/gltf/${name}.gltf`, gltf => {
    if (current) scene.remove(current);
    current = gltf.scene;
    clips = gltf.animations;
    mixer = clips.length ? new THREE.AnimationMixer(current) : null;
    animSelect.innerHTML = '';
    for (const c of clips) animSelect.add(new Option(c.name, c.name));
    // a city block's clips are the props' own loops (rotors, fountains): play them all together
    const loops = clips.length && clips.every(c => / loop$/.test(c.name));
    document.getElementById('animrow').hidden = !clips.length || loops;
    if (loops) {
      for (const c of clips) mixer.clipAction(c).play();
    } else if (clips.length) {
      animSelect.value = params.get('anim') || (clips.find(c => /^SKELETON_\d+_IDLE(_SHORT)?$/.test(c.name)) || clips[0]).name;
      play(animSelect.value);
    }
    current.traverse(o => { if (o.material && o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace; });
    scene.add(current);
    // frame the scene without the sky and backdrop around a city block
    const box = new THREE.Box3();
    current.updateMatrixWorld(true);
    current.traverse(o => {
      let sky = false;
      for (let p = o; p; p = p.parent) if (/backdrop|skydome/i.test(p.name)) sky = true;
      if (!o.isMesh || sky) return;
      // skinned vertices are in the bind pose's model space, under the (Y-up) mesh node
      if (o.isSkinnedMesh) box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
      else box.expandByObject(o);
    });
    if (box.isEmpty()) box.setFromObject(current);
    const size = box.getSize(new THREE.Vector3()).length();
    const centre = box.getCenter(new THREE.Vector3());
    controls.target.copy(centre);
    camera.position.copy(centre).add(new THREE.Vector3(0.3, 0.35, 1).multiplyScalar(size * 0.6));
    camera.near = size / 1000; camera.far = size * 10; camera.updateProjectionMatrix();
    let tris = 0;
    current.traverse(o => { if (o.isMesh) tris += o.geometry.index.count / 3; });
    document.getElementById('info').textContent =
      `${name}: ${tris} triangles` + (clips.length ? `, ${clips.length} animations` : '');
  }, undefined, err => { document.getElementById('info').textContent = `${name}: ${err.message || err}`; });
}
load(select.value);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
